<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greeting</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:transparent;padding:1.25rem}
  .greeting{font-family:'Lora',serif;font-size:22px;font-weight:400;color:#1a1a1a;margin-bottom:4px}
  .date{font-family:'Lora',serif;font-size:13px;color:#999;font-weight:400}
</style>
</head>
<body>
  <div class="greeting" id="g"></div>
  <div class="date" id="d"></div>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick(){
  const now=new Date();
  const h=now.getHours();
  let gr;
  if(h>=5&&h<12) gr='Good morning, Andrea';
  else if(h>=12&&h<17) gr='Good afternoon, Andrea';
  else if(h>=17&&h<22) gr='Good evening, Andrea';
  else gr='Working late, Andrea';
  document.getElementById('g').textContent=gr;
  document.getElementById('d').textContent=days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
}
tick();
</script>
</body>
</html>
